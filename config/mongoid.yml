development:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://127.0.0.1:27017/book_price_api_development").to_json %>
      options:
        server_selection_timeout: 3
        max_pool_size: 5

test:
  clients:
    default:
      # Deliberately ignores MONGODB_URI to protect development/production data.
      uri: "mongodb://127.0.0.1:27017/book_price_api_test"
      options:
        server_selection_timeout: 3
        max_pool_size: 2

production:
  clients:
    default:
      uri: <%= (ENV["MONGODB_URI"] || (Rails.env.production? ? (raise "MONGODB_URI is required in production") : "mongodb://127.0.0.1:27017/book_price_api_production")).to_json %>
      options:
        server_selection_timeout: 5
        max_pool_size: 5
